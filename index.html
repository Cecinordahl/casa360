    <!-- Lets Google read this as a holiday rental. No street address or
         coordinates on purpose: the villa's exact location stays off the
         public site (see SCHEMA.md). -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VacationRental",
  "name": "Casa Hoyo 8",
  "description": "A modern 3-bedroom townhouse frontline on the 8th hole of San Roque Club's Old Course in Sotogrande, Costa del Sol. Sleeps 6, with a shared pool, gym and golf on the doorstep.",
  "image": [
    "https://res.cloudinary.com/miaxzv1p/image/upload/c_fill,w_1200,h_630,q_auto,f_jpg/v1785154965/houseShowcase/main/jrvqinlttmu5hp1kqlnl.jpg"
  ],
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "San Roque",
    "addressRegion": "Cádiz",
    "addressCountry": "ES"
  },
  "containsPlace": {
    "@type": "Accommodation",
    "additionalType": "EntirePlace",
    "numberOfBedrooms": 3,
    "numberOfFullBathrooms": 2,
    "numberOfPartialBathrooms": 1,
    "occupancy": {
      "@type": "QuantitativeValue",
      "maxValue": 6
    }
  },
  "amenityFeature": [
    {
      "@type": "LocationFeatureSpecification",
      "name": "Shared swimming pool",
      "value": true
    },
    {
      "@type": "LocationFeatureSpecification",
      "name": "Gym",
      "value": true
    },
    {
      "@type": "LocationFeatureSpecification",
      "name": "Garden",
      "value": true
    },
    {
      "@type": "LocationFeatureSpecification",
      "name": "Barbecue",
      "value": true
    },
    {
      "@type": "LocationFeatureSpecification",
      "name": "Golf course access",
      "value": true
    }
  ]
}
    </script>
